name: Update README Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'  # README 자체가 바뀐 커밋에는 다시 실행 안 함 (무한루프 방지)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 파일별 최종 수정일 조회를 위해 전체 히스토리 필요

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: README 생성 스크립트 실행
        run: python generate_readme.py

      - name: 변경사항 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: README 목차 자동 갱신"
          git push